<svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="brideGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#7D5705" />
    </linearGradient>

    <!-- Sacred Terracotta / Crimson -->
    <linearGradient id="brideCrimson" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#800D15" />
    </linearGradient>

    <!-- Fresh Mango Green -->
    <linearGradient id="mangoGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="50%" stop-color="#43A047" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>

    <!-- Golden Halo -->
    <radialGradient id="brideGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>

    <!-- Coconut Texture -->
    <linearGradient id="coconutBrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63" />
      <stop offset="50%" stop-color="#5D4037" />
      <stop offset="100%" stop-color="#3E2723" />
    </linearGradient>
  </defs>

  <!-- Radiant Sunburst Glow -->
  <circle cx="80" cy="80" r="74" fill="url(#brideGlow)" />
  <circle cx="80" cy="80" r="68" stroke="url(#brideGold)" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.8" />
  <circle cx="80" cy="80" r="62" stroke="#E0C068" stroke-width="0.8" opacity="0.6" />

  <!-- Outer 12 Lotus Petal Ring -->
  <g fill="#FFFDF5" stroke="url(#brideGold)" stroke-width="0.8">
    <path d="M80 18 C76 26 76 32 80 36 C84 32 84 26 80 18 Z" />
    <path d="M80 18 C76 26 76 32 80 36 C84 32 84 26 80 18 Z" transform="rotate(30 80 80)" />
    <path d="M80 18 C76 26 76 32 80 36 C84 32 84 26 80 18 Z" transform="rotate(60 80 80)" />
    <path d="M80 18 C76 26 76 32 80 36 C84 32 84 26 80 18 Z" transform="rotate(90 80 80)" />
    <path d="M80 18 C76 26 76 32 80 36 C84 32 84 26 80 18 Z" transform="rotate(120 80 80)" />
    <path d="M80 18 C76 26 76 32 80 36 C84 32 84 26 80 18 Z" transform="rotate(150 80 80)" />
    <path d="M80 18 C76 26 76 32 80 36 C84 32 84 26 80 18 Z" transform="rotate(180 80 80)" />
    <path d="M80 18 C76 26 76 32 80 36 C84 32 84 26 80 18 Z" transform="rotate(210 80 80)" />
    <path d="M80 18 C76 26 76 32 80 36 C84 32 84 26 80 18 Z" transform="rotate(240 80 80)" />
    <path d="M80 18 C76 26 76 32 80 36 C84 32 84 26 80 18 Z" transform="rotate(270 80 80)" />
    <path d="M80 18 C76 26 76 32 80 36 C84 32 84 26 80 18 Z" transform="rotate(300 80 80)" />
    <path d="M80 18 C76 26 76 32 80 36 C84 32 84 26 80 18 Z" transform="rotate(330 80 80)" />
  </g>

  <!-- Inner Medallion Ground -->
  <circle cx="80" cy="80" r="52" fill="#FAF0DE" stroke="url(#brideGold)" stroke-width="1.8" />
  <circle cx="80" cy="80" r="49" stroke="#E6BE72" stroke-width="0.8" stroke-dasharray="2 3" fill="none" />

  <!-- SACRED PURNA KUMBHAM / KALASH -->
  <!-- 5 Mango Leaves (Amra Pallava) -->
  <g>
    <!-- Left Outer Leaf -->
    <path d="M80 72 C62 66 52 50 48 40 C60 42 72 54 80 72 Z" fill="url(#mangoGreen)" stroke="#1B5E20" stroke-width="0.8" />
    <!-- Left Inner Leaf -->
    <path d="M80 72 C68 62 62 46 62 34 C72 38 78 52 80 72 Z" fill="url(#mangoGreen)" stroke="#1B5E20" stroke-width="0.8" />
    <!-- Center Leaf (Tallest) -->
    <path d="M80 72 C74 58 75 42 80 28 C85 42 86 58 80 72 Z" fill="url(#mangoGreen)" stroke="#1B5E20" stroke-width="0.8" />
    <!-- Right Inner Leaf -->
    <path d="M80 72 C92 62 98 46 98 34 C88 38 82 52 80 72 Z" fill="url(#mangoGreen)" stroke="#1B5E20" stroke-width="0.8" />
    <!-- Right Outer Leaf -->
    <path d="M80 72 C98 66 108 50 112 40 C100 42 88 54 80 72 Z" fill="url(#mangoGreen)" stroke="#1B5E20" stroke-width="0.8" />
  </g>

  <!-- Sacred Coconut (Sriphala) on Top of Leaves -->
  <ellipse cx="80" cy="56" rx="14" ry="18" fill="url(#coconutBrown)" stroke="url(#brideGold)" stroke-width="1" />
  <!-- Coconut Crown / Tilak -->
  <path d="M77 40 L80 33 L83 40 Z" fill="#D32F2F" />
  <circle cx="80" cy="52" r="2.2" fill="#FFE082" />
  <circle cx="80" cy="58" r="2.2" fill="#FFE082" />

  <!-- Kalash Pot Body (Swarna Kumbha) -->
  <!-- Pot Neck & Rim -->
  <path d="M66 76 C66 73 70 71 80 71 C90 71 94 73 94 76 C94 79 90 80 80 80 C70 80 66 79 66 76 Z" fill="url(#brideGold)" stroke="#664600" stroke-width="1" />
  
  <!-- Pot Belly -->
  <path d="M68 79 C62 83 56 93 57 104 C58 114 66 122 80 122 C94 122 102 114 103 104 C104 93 98 83 92 79 Z" fill="url(#brideGold)" stroke="#664600" stroke-width="1.2" />

  <!-- Sacred Crimson Ribbon / Kumkum Waist Band -->
  <path d="M57 99 C64 103 72 105 80 105 C88 105 96 103 103 99 C103.5 103 102 108 99 111 C93 115 87 116 80 116 C73 116 67 115 61 111 C58 108 56.5 103 57 99 Z" fill="url(#brideCrimson)" />

  <!-- Sacred Swastika / Shubh Symbol on Belly -->
  <g stroke="#FFE082" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 94 V108" />
    <path d="M73 101 H87" />
    <path d="M80 94 H85" />
    <path d="M87 101 V106" />
    <path d="M80 108 H75" />
    <path d="M73 101 V96" />
  </g>

  <!-- Kalash Base Ring -->
  <path d="M69 121 C69 119 73 118 80 118 C87 118 91 119 91 121 L89 127 C89 128.5 85 129.5 80 129.5 C75 129.5 71 128.5 71 127 Z" fill="url(#brideGold)" stroke="#664600" stroke-width="1" />
</svg>
